# Render blueprint — one-click deploy of LiteFX (single web service
# serving both the API and the built frontend on one URL).
services:
  - type: web
    name: litefx
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: DATABASE_URL
        sync: false
