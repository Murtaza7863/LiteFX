<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LiteFX — collapse messy trip debts into minimal cross-border transfers and settle each through the cheapest rail." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("litefx-theme") || "system";
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>LiteFX — Cross-border Netting & Settlement</title>
  </head>
  <body>
    <div id="root">
      <div
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#171513;color:#8a8378;font-family:system-ui,sans-serif;font-size:14px"
      >
        LiteFX
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
